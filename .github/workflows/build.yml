name: Build and Push Aurora iMac Image

on:
  schedule:
    - cron: '10 10 * * *' # Daily rebuild at 10:10 UTC
  push:
    branches:
      - master
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  workflow_dispatch:

env:
  IMAGE_NAME: aurora-imac
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.8.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build container image locally for verification
        id: build-local
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Containerfile
          load: true
          tags: ${{ env.IMAGE_NAME }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run image verification test suite
        run: |
          echo "Starting verification container..."
          docker run --rm ${{ env.IMAGE_NAME }}:test bash -c '
            set -euo pipefail
            KVER=$(ls /usr/lib/modules | head -n1)
            echo "1. Checking module file presence..."
            test -f /usr/lib/modules/${KVER}/updates/snd-hda-codec-cs8409.ko.zst
            echo "2. Checking driver path resolution..."
            modinfo -b / -k ${KVER} -n snd-hda-codec-cs8409 | grep -q "/updates/"
            echo "3. Checking modprobe dsp_driver config..."
            grep -q "dsp_driver=1" /usr/lib/modprobe.d/cs8409.conf
            echo "4. Checking cosign public key..."
            test -f /etc/pki/containers/aurora-imac.pub
            echo "All image verification tests PASSED!"
          '

      - name: Push container image to GHCR
        id: build-and-push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      - name: Sign container image with Cosign
        if: github.event_name != 'pull_request'
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ""
        run: |
          cosign sign -y --key env://COSIGN_PRIVATE_KEY \
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}@${{ steps.build-and-push.outputs.digest }}
